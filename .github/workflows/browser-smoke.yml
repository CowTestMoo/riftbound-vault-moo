name: Browser Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run desktop, phone, and tablet smoke tests
        run: npx playwright test -c tests/playwright.config.js
