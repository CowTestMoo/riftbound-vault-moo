name: One-time cross-platform maintenance

on:
  push:
    paths:
      - '.github/workflows/maintenance-cross-platform.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply conservative maintenance fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Load scripts in parallel while preserving execution order.
          p = Path('index.html')
          s = p.read_text()
          if 'rel="preconnect" href="https://ivqtgclygiikagfuicjd.supabase.co"' not in s:
              s = s.replace(
                  '<link rel="icon" href="icon.svg?v=asol1" type="image/svg+xml">',
                  '<link rel="icon" href="icon.svg?v=asol1" type="image/svg+xml">\n'
                  '  <link rel="preconnect" href="https://ivqtgclygiikagfuicjd.supabase.co" crossorigin>\n'
                  '  <link rel="preconnect" href="https://cmsassets.rgpub.io" crossorigin>'
              )
          s = re.sub(r'<script(?![^>]*\bdefer\b) src=', '<script defer src=', s)
          s = s.replace('polish.js?v=asol5', 'polish.js?v=asol6')
          s = s.replace('dashboard-toggles.js?v=2', 'dashboard-toggles.js?v=3')
          s = s.replace('app.js?v=8', 'app.js?v=9')
          s = s.replace('smart-import-badges.js?v=1', 'smart-import-badges.js?v=2')
          p.write_text(s)

          # 2) Stop hundreds of background image requests on mobile/tablet.
          p = Path('app.js')
          s = p.read_text()
          start = s.index('function preloadHalfCatalog(cards){')
          end = s.index('\n\nasync function loadCatalog()', start)
          replacement = r'''function preloadHalfCatalog(cards){
  if(cardPreloadStarted)return;
  cardPreloadStarted=true;

  const coarse=window.matchMedia('(pointer: coarse)').matches;
  const narrow=window.matchMedia('(max-width: 900px)').matches;
  const connection=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
  const constrained=!!connection?.saveData||/^(slow-2g|2g|3g)$/i.test(connection?.effectiveType||'');
  if(coarse||narrow||constrained){
    window.dispatchEvent(new CustomEvent('riftbound-card-preload-complete',{detail:{count:0,skipped:true}}));
    return;
  }

  const target=Math.min(24,cards.length);
  const urls=[];
  const seen=new Set();
  for(const card of cards){
    if(!card.imageUrl||seen.has(card.imageUrl))continue;
    seen.add(card.imageUrl);urls.push(card.imageUrl);
    if(urls.length>=target)break;
  }
  let cursor=0,active=0,pumpScheduled=false;
  const concurrency=2;
  const pump=()=>{
    if(document.hidden)return;
    while(active<concurrency&&cursor<urls.length){
      const image=new Image();active++;cardPreloadImages.add(image);
      image.decoding='async';image.fetchPriority='low';
      image.onload=image.onerror=()=>{active--;cardPreloadImages.delete(image);schedulePump()};
      image.src=urls[cursor++];
    }
    if(cursor>=urls.length&&active===0){
      document.removeEventListener('visibilitychange',resume);
      window.dispatchEvent(new CustomEvent('riftbound-card-preload-complete',{detail:{count:urls.length}}));
    }
  };
  const schedulePump=()=>{
    if(pumpScheduled)return;
    pumpScheduled=true;
    const run=()=>{pumpScheduled=false;pump()};
    if('requestIdleCallback' in window)requestIdleCallback(run,{timeout:1200});
    else setTimeout(run,150);
  };
  const resume=()=>{if(!document.hidden)schedulePump()};
  const start=()=>{schedulePump();window.dispatchEvent(new CustomEvent('riftbound-card-preload-started',{detail:{count:urls.length}}))};
  document.addEventListener('visibilitychange',resume);
  if('requestIdleCallback' in window)requestIdleCallback(start,{timeout:1800});else setTimeout(start,250);
}'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # 3) Scope visual decoration work to changed nodes instead of rescanning the whole page.
          Path('polish.js').write_text(r'''(() => {
  'use strict';

  const rarityMap = new Map();
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  let lastStats = new Map();
  let statsQueued=false;

  const norm = v => String(v || '').trim().toLowerCase().replace(/\s+/g,'-');
  const each=(root,selector,fn)=>{
    if(root?.nodeType!==1&&root!==document)return;
    if(root!==document&&root.matches?.(selector))fn(root);
    root.querySelectorAll?.(selector).forEach(fn);
  };

  function rarityClass(value){
    const r = norm(value);
    if (!r) return '';
    if (r.includes('overnumber')) return 'overnumbered';
    if (r.includes('showcase')) return 'showcase';
    if (r.includes('mythic')) return 'mythic';
    if (r.includes('legend')) return 'legendary';
    if (r.includes('epic')) return 'epic';
    if (r.includes('rare')) return 'rare';
    if (r.includes('special')) return 'special';
    return r;
  }

  function useCatalog(cards){
    if(!Array.isArray(cards)||!cards.length)return;
    for(const card of cards){
      const code=String(card.cardCode||card.code||card.id||'');
      if(code)rarityMap.set(code,rarityClass(card.rarity));
    }
    decorateCards(document);
  }

  function connectCatalog(){
    const shared=window.RiftboundApp?.getCatalog?.()||[];
    if(shared.length){useCatalog(shared);return;}
    window.addEventListener('riftbound-catalog-ready',event=>useCatalog(event.detail?.catalog||[]),{once:true});
  }

  function decorateCards(root=document){
    each(root,'.card-tile[data-card]',tile=>{
      const rarity=rarityMap.get(tile.dataset.card);
      if(rarity)tile.dataset.rarity=rarity;
    });
  }

  function decorateStorage(root=document){
    each(root,'.storage-box',box=>{
      const heading=box.querySelector('h3')?.textContent||'';
      const domain=heading.trim().split(/\s+/)[0];
      if(domain)box.dataset.domain=norm(domain);
    });
  }

  function celestialEmptyStates(root=document){
    each(root,'.empty-state',el=>{
      const text=(el.textContent||'').trim();
      if(text==='No cards match these filters.')el.textContent='No cards found in this corner of the cosmos.';
      else if(text==='No decks yet.')el.textContent='No decks are charting the stars yet.';
      else if(text==='Nothing is currently loaned out.')el.textContent='All borrowed relics have returned to your orbit.';
      else if(text==='No cards here yet.')el.textContent='This celestial vault is still waiting for its first card.';
    });
  }

  function updateLoadingState(){
    const status=document.getElementById('catalogStatus');
    if(!status)return;
    document.body.classList.toggle('catalog-loading',/loading/i.test(status.textContent||''));
  }

  function animateStatChanges(){
    statsQueued=false;
    document.querySelectorAll('.stats-strip > div').forEach(cell=>{
      const span=cell.querySelector('span');
      if(!span)return;
      const prev=lastStats.get(span.id),now=span.textContent;
      if(prev!==undefined&&prev!==now&&!reduce.matches){
        cell.classList.remove('stat-changed');
        void cell.offsetWidth;
        cell.classList.add('stat-changed');
        setTimeout(()=>cell.classList.remove('stat-changed'),760);
      }
      lastStats.set(span.id,now);
    });
  }
  function queueStats(){if(statsQueued)return;statsQueued=true;requestAnimationFrame(animateStatChanges)}

  function burstAt(x,y,rarity=''){
    if(reduce.matches)return;
    const special=['epic','legendary','mythic'].includes(rarity)?'gold':['showcase','special','overnumbered'].includes(rarity)?'violet':'';
    const count=special?18:13;
    for(let i=0;i<count;i++){
      const spark=document.createElement('i');
      spark.className=`collection-burst ${special}`.trim();
      spark.style.left=`${x}px`;spark.style.top=`${y}px`;
      spark.style.setProperty('--angle',`${(360/count)*i+Math.random()*18}deg`);
      spark.style.setProperty('--distance',`${32+Math.random()*58}px`);
      spark.style.animationDelay=`${Math.random()*70}ms`;
      document.body.appendChild(spark);
      setTimeout(()=>spark.remove(),950);
    }
  }

  document.addEventListener('click',event=>{
    const add=event.target.closest('[data-adjust],[data-bulk]');
    if(!add)return;
    const delta=Number(add.dataset.adjust??add.dataset.bulk??0);
    if(delta<=0)return;
    const rect=add.getBoundingClientRect(),code=add.dataset.code||'';
    burstAt(rect.left+rect.width/2,rect.top+rect.height/2,rarityMap.get(code)||'');
  },true);

  const observer=new MutationObserver(records=>{
    let stats=false,loading=false;
    for(const record of records){
      if(record.target?.closest?.('.stats-strip'))stats=true;
      if(record.target?.id==='catalogStatus'||record.target?.parentElement?.id==='catalogStatus')loading=true;
      for(const node of record.addedNodes||[]){
        if(node.nodeType!==1)continue;
        decorateCards(node);decorateStorage(node);celestialEmptyStates(node);
        if(node.matches?.('.stats-strip, .stats-strip *')||node.querySelector?.('.stats-strip'))stats=true;
        if(node.id==='catalogStatus'||node.querySelector?.('#catalogStatus'))loading=true;
      }
    }
    if(stats)queueStats();
    if(loading)updateLoadingState();
  });

  observer.observe(document.body,{childList:true,subtree:true,characterData:true});
  decorateCards(document);decorateStorage(document);celestialEmptyStates(document);
  updateLoadingState();animateStatChanges();connectCatalog();
})();
''')

          # 4) Batch dashboard work and ignore unrelated DOM mutations.
          Path('dashboard-toggles.js').write_text(r'''(() => {
  'use strict';
  const SETTINGS_KEY='riftbound-vault-ux-v1';
  const DEFAULTS={showFilterSummary:false,showRecentlyAdded:false,showSetCompletion:false};
  let queued=false;

  function readSettings(){try{return {...DEFAULTS,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch{return {...DEFAULTS}}}
  function writeSetting(key,value){const settings=readSettings();settings[key]=!!value;localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
  function makeToggle(id,key,title,description){const row=document.createElement('div');row.className='setting-row collection-panel-setting';row.innerHTML=`<div class="setting-copy"><strong>${title}</strong><small>${description}</small></div><input id="${id}" class="sound-toggle" type="checkbox" aria-label="${title}">`;row.querySelector('input').dataset.panelSetting=key;return row}
  function ensureSettingsToggles(){const panel=document.getElementById('uxSettings');if(!panel)return false;if(!document.getElementById('showFilterSummaryToggle')){panel.appendChild(makeToggle('showFilterSummaryToggle','showFilterSummary','Filter summary','Show the current filters and visible-card count.'));panel.appendChild(makeToggle('showRecentlyAddedToggle','showRecentlyAdded','Recently Added','Show your latest collection additions.'));panel.appendChild(makeToggle('showSetCompletionToggle','showSetCompletion','Set Completion','Show unique-card progress for each set.'))}return true}
  function ensureExportInSettings(){const panel=document.getElementById('uxSettings'),exportBtn=document.getElementById('exportBtn');if(!panel||!exportBtn)return false;let row=document.getElementById('backupExportSetting');if(!row){row=document.createElement('div');row.id='backupExportSetting';row.className='setting-row backup-export-setting';row.innerHTML='<div class="setting-copy"><strong>Export backup</strong><small>Download a JSON copy of your local collection data.</small></div>';panel.appendChild(row)}if(exportBtn.parentElement!==row){exportBtn.classList.add('settings-export-btn');exportBtn.textContent='Export';row.appendChild(exportBtn)}return true}
  function setVisible(element,visible){if(!element)return;element.style.display=visible?'':'none';element.setAttribute('aria-hidden',visible?'false':'true')}
  function applyVisibility(){const settings=readSettings(),filterSummary=document.getElementById('filterSummary'),dashboard=document.getElementById('collectionDashboard'),recent=dashboard?.querySelector('.recent-panel'),completion=dashboard?.querySelector('.set-progress-panel');setVisible(filterSummary,settings.showFilterSummary);setVisible(recent,settings.showRecentlyAdded);setVisible(completion,settings.showSetCompletion);if(dashboard)setVisible(dashboard,settings.showRecentlyAdded||settings.showSetCompletion);document.querySelectorAll('.completion-burst').forEach(el=>setVisible(el,settings.showSetCompletion));const filterToggle=document.getElementById('showFilterSummaryToggle'),recentToggle=document.getElementById('showRecentlyAddedToggle'),completionToggle=document.getElementById('showSetCompletionToggle');if(filterToggle)filterToggle.checked=!!settings.showFilterSummary;if(recentToggle)recentToggle.checked=!!settings.showRecentlyAdded;if(completionToggle)completionToggle.checked=!!settings.showSetCompletion}
  function refresh(){queued=false;ensureSettingsToggles();ensureExportInSettings();applyVisibility()}
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(refresh)}
  function relevant(node){if(node?.nodeType!==1)return false;return node.matches?.('#uxSettings,#collectionDashboard,#filterSummary,.completion-burst')||!!node.querySelector?.('#uxSettings,#collectionDashboard,#filterSummary,.completion-burst')}
  function init(){refresh();document.addEventListener('change',event=>{const input=event.target.closest('[data-panel-setting]');if(!input)return;writeSetting(input.dataset.panelSetting,input.checked);applyVisibility()});const observer=new MutationObserver(records=>{for(const record of records){for(const node of record.addedNodes||[]){if(relevant(node)){schedule();return}}}});observer.observe(document.body,{childList:true,subtree:true});window.addEventListener('riftbound-ui-render',schedule);window.addEventListener('storage',event=>{if(event.key===SETTINGS_KEY)schedule()})}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
''')

          # 5) Observe only the spreadsheet dialog, not every mutation on the page.
          Path('smart-import-badges.js').write_text(r'''(() => {
  'use strict';
  let queued=false;
  function enhance(){
    const mode=document.getElementById('sheetMode')?.value;
    document.querySelectorAll('#sheetPreview .spreadsheet-tr:not(.spreadsheet-th)').forEach(row=>{
      row.querySelectorAll('.smart-badge').forEach(x=>x.remove());
      if(mode!=='smart'||!row.classList.contains('matched'))return;
      const assignment=row.children?.[2];if(!assignment)return;
      const text=assignment.textContent||'';
      const matches=[...text.matchAll(/\+\s*(\d+)\s+new/gi)];
      if(matches.length){const total=matches.reduce((n,m)=>n+Number(m[1]||0),0);assignment.insertAdjacentHTML('beforeend',`<span class="smart-badge new">+${total} new</span>`)}
      else assignment.insertAdjacentHTML('beforeend','<span class="smart-badge owned">Already owned</span>');
    });
  }
  function schedule(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;enhance()})}
  document.addEventListener('change',e=>{if(e.target.id==='sheetMode'||e.target.matches('[data-map]'))setTimeout(schedule,0)});
  document.addEventListener('click',e=>{if(e.target.closest('#openSpreadsheetImport,#reviewSheet,[data-save-row],[data-ignore-row],#sheetProblems'))setTimeout(schedule,30)});
  const observer=new MutationObserver(schedule);
  function init(){const dialog=document.getElementById('spreadsheetImportDialog');if(dialog)observer.observe(dialog,{childList:true,subtree:true});schedule()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
''')
          PY

      - name: Validate JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done

      - name: Commit maintenance patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "CowTestMoo"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/maintenance-cross-platform.yml
          git add index.html app.js polish.js dashboard-toggles.js smart-import-badges.js
          git commit -m "Reduce cross-platform startup and observer spam"
          git push
