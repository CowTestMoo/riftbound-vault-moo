name: Mobile Login Gate Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-login-gate.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add preflight login gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='  <title>Riftbound Vault</title>\n'
          tag='  <script src="auth-boot.js?v=1"></script>\n'
          assert marker in s
          if tag not in s:
              s=s.replace(marker,marker+tag,1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("riftbound-vault-shell-v78","riftbound-vault-shell-v79",1)
          s=s.replace("  './index.html',\n","  './index.html',\n  './login.html',\n  './auth-boot.js',\n",1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check auth-boot.js
          node --check sw.js
          grep -q 'auth-boot.js?v=1' index.html
          grep -q "'./login.html'" sw.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Route signed-out clients to lightweight login'
          git push origin HEAD:main
