name: Mobile Performance Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-performance-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile performance changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='  <link rel="stylesheet" href="mobile-performance.css?v=1">\n'
          marker='  <link rel="stylesheet" href="styles.css?v=asol2">\n'
          assert marker in s
          if css not in s:
              s=s.replace(marker,marker+css,1)
          s=s.replace('theme-loader.js?v=3','theme-loader.js?v=4')
          s=s.replace('app.js?v=9','app.js?v=10')
          p.write_text(s,encoding='utf-8')

          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          old="const PAGE_SIZE = 60;"
          new="const PAGE_SIZE = window.matchMedia('(max-width:900px), (pointer:coarse)').matches ? 24 : 60;"
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("riftbound-vault-shell-v79","riftbound-vault-shell-v80",1)
          marker="  './styles.css',\n"
          css="  './mobile-performance.css',\n"
          assert marker in s
          if css not in s:
              s=s.replace(marker,marker+css,1)
          p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
          node --check theme-loader.js
          node --check sw.js
          grep -q 'mobile-performance.css?v=1' index.html
          grep -q "? 24 : 60" app.js
          grep -q 'riftbound-vault-shell-v80' sw.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js sw.js
          git commit -m 'Prioritize mobile interaction performance'
          git push origin HEAD:main
