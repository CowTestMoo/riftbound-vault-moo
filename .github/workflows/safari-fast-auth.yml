name: Safari Fast Auth Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/safari-fast-auth.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch signed-out startup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # index.html: render auth shell immediately, reduce render-blocking CSS,
          # and run auth scripts before catalog/theme/features.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<body class="catalog-loading">','<body class="catalog-loading vault-locked">',1)
          marker='  <canvas id="cosmicSky" aria-hidden="true"></canvas>'
          lock='''  <section id="vaultLockScreen" class="vault-lock-screen"><div class="vault-lock-card"><div class="vault-lock-mark" aria-hidden="true">✦</div><h1>Riftbound Vault</h1><div class="lock-subtitle">Private cosmic archive</div><p>This vault is invite-only. Sign in with an invited account to manage your collection.</p><div class="vault-lock-actions"><button id="vaultLockSignIn" class="primary-btn" type="button">Sign In</button></div><p class="lock-note">Need access? Ask the vault owner for an invitation.</p></div></section>'''
          if 'id="vaultLockScreen"' not in s:
              s=s.replace(marker,lock+'\n'+marker,1)

          essential={'styles.css','vault-features.css','invite-lock.css'}
          def css_repl(m):
              href=m.group(1)
              path=href.split('?',1)[0]
              if path in essential:
                  return m.group(0)
              return f'<link rel="stylesheet" href="{href}" media="print" onload="this.media=\'all\'">'
          s=re.sub(r'<link rel="stylesheet" href="([^"]+)">',css_repl,s)

          # Bump changed assets so the service worker cannot serve stale copies.
          bumps={
              'auth-session-pref.js?v=1':'auth-session-pref.js?v=2',
              'cloud-sync.js?v=7':'cloud-sync.js?v=8',
              'invite-lock.js?v=4':'invite-lock.js?v=5',
              'theme-loader.js?v=2':'theme-loader.js?v=3',
              'app.js?v=8':'app.js?v=9',
          }
          for a,b in bumps.items():
              s=s.replace(a,b)

          tags=re.findall(r'<script defer src="[^"]+"></script>',s)
          assert len(tags)>=30, f'Unexpected script count: {len(tags)}'
          src=lambda tag: re.search(r'src="([^"?]+)',tag).group(1)
          priority=['pwa.js','auth-session-pref.js','cloud-sync.js','auth-hardening.js','invite-lock.js','theme-bootstrap.js','theme-loader.js','app.js']
          ordered=[]
          for name in priority:
              match=next((t for t in tags if src(t)==name),None)
              assert match, f'Missing priority script {name}'
              ordered.append(match)
          ordered.extend(t for t in tags if src(t) not in priority)
          old=''.join(tags)
          s=s.replace(old,''.join(ordered),1)
          p.write_text(s,encoding='utf-8')

          # cloud-sync: auth dialog must exist before DOMContentLoaded so the lock screen can sign in immediately.
          p=Path('cloud-sync.js'); s=p.read_text(encoding='utf-8')
          needle="  document.addEventListener('click',async e=>{"
          assert needle in s
          if '  ensureAuthDialog();\n\n'+needle not in s:
              s=s.replace(needle,'  ensureAuthDialog();\n\n'+needle,1)
          p.write_text(s,encoding='utf-8')

          # invite-lock: script is at the end of body, so do not wait for all deferred scripts/CSS to finish.
          p=Path('invite-lock.js'); s=p.read_text(encoding='utf-8')
          old="  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();"
          assert old in s
          s=s.replace(old,'  init();',1)
          p.write_text(s,encoding='utf-8')

          # auth-session-pref: stop observing the entire application after the checkbox exists.
          p=Path('auth-session-pref.js'); s=p.read_text(encoding='utf-8')
          old="""  function init(){\n    ensureCheckbox();\n    const observer=new MutationObserver(ensureCheckbox);\n    observer.observe(document.body,{childList:true,subtree:true});\n  }"""
          new="""  function init(){\n    ensureCheckbox();\n    if(document.getElementById('cloudStaySignedIn'))return;\n    const observer=new MutationObserver(()=>{\n      ensureCheckbox();\n      if(document.getElementById('cloudStaySignedIn'))observer.disconnect();\n    });\n    observer.observe(document.body,{childList:true,subtree:true});\n  }"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # app: do not fetch/parse 1.34 MB catalog while signed out.
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          anchor='let cardPreloadStarted=false;\nconst cardPreloadImages=new Set();'
          assert anchor in s
          s=s.replace(anchor,anchor+'\nlet catalogLoadPromise=null;',1)
          fn='async function loadCatalog(){'
          assert fn in s
          helper="""function ensureCatalogLoaded(){\n  if(catalog.length)return Promise.resolve(catalog);\n  if(catalogLoadPromise)return catalogLoadPromise;\n  catalogLoadPromise=loadCatalog().finally(()=>{if(!catalog.length)catalogLoadPromise=null});\n  return catalogLoadPromise;\n}\n\n"""
          s=s.replace(fn,helper+fn,1)
          old='    loadCatalog();'
          new="""    if(window.RiftboundCloud?.getSession?.())ensureCatalogLoaded();\n    else $('catalogStatus').textContent='Sign in to load catalog';\n    window.addEventListener('riftbound-auth-storage-change',()=>{\n      if(window.RiftboundCloud?.getSession?.())ensureCatalogLoaded();\n    });"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # theme-loader: do not start animation/audio downloads behind the sign-in gate.
          p=Path('theme-loader.js'); s=p.read_text(encoding='utf-8')
          old='  load();\n})();'
          new="""  function bootTheme(){\n    if(window.RiftboundCloud?.getSession?.())load();\n  }\n  bootTheme();\n  window.addEventListener('riftbound-auth-storage-change',bootTheme);\n})();"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # Force clean PWA cache generation.
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          assert "riftbound-vault-shell-v77" in s
          s=s.replace('riftbound-vault-shell-v77','riftbound-vault-shell-v78',1)
          p.write_text(s,encoding='utf-8')
          PY

          node --check app.js
          node --check cloud-sync.js
          node --check invite-lock.js
          node --check auth-session-pref.js
          node --check theme-loader.js
          node --check sw.js
          grep -q 'Sign in to load catalog' app.js
          grep -q 'vault-locked' index.html
          grep -q 'cloud-sync.js?v=8' index.html
          grep -q 'app.js?v=9' index.html

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js cloud-sync.js auth-session-pref.js invite-lock.js theme-loader.js sw.js
          git commit -m 'Make Safari sign-in load before catalog'
          git push origin HEAD:main
