name: Sync Riftbound card catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
  push:
    paths:
      - '.github/workflows/sync-card-catalog.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out vault
        uses: actions/checkout@v4

      - name: Download latest Riftbound catalog
        run: |
          mkdir -p data
          curl -L --fail --retry 3 --retry-delay 2 \
            'https://github.com/LouisCourrian/riftbound-cards/releases/latest/download/cards.json' \
            -o data/cards.json
          python - <<'PY'
          import json
          with open('data/cards.json', encoding='utf-8') as f:
              data = json.load(f)
          cards = data if isinstance(data, list) else data.get('cards', [])
          if not cards or len(cards) < 100:
              raise SystemExit('Downloaded catalog does not look valid')
          print(f'Validated {len(cards)} cards')
          PY

      - name: Commit catalog only when it changed
        run: |
          if git diff --quiet -- data/cards.json && git ls-files --error-unmatch data/cards.json >/dev/null 2>&1; then
            echo 'Catalog is already current.'
            exit 0
          fi
          git config user.name 'riftbound-vault-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/cards.json
          git commit -m 'Update Riftbound card catalog'
          git push
