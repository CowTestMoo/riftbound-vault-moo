name: Validate Assets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate local page assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          import re

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.assets=[]
              def handle_starttag(self, tag, attrs):
                  values=dict(attrs)
                  value=values.get('src') if tag=='script' else values.get('href') if tag=='link' else None
                  if value:
                      self.assets.append(value)

          def local_path(raw, base=Path('.')):
              if not raw or raw.startswith(('#','data:','blob:')) or '://' in raw:
                  return None
              path=urlsplit(raw).path
              if not path or path.startswith('/'):
                  return None
              return (base / path.removeprefix('./')).resolve()

          root=Path('.').resolve()
          parser=Parser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))

          index_local=[]
          missing=[]
          for raw in parser.assets:
              path=local_path(raw)
              if path is None:
                  continue
              try:
                  rel=path.relative_to(root)
              except ValueError:
                  continue
              index_local.append(str(rel))
              if not path.is_file():
                  missing.append(f'index.html -> {rel}')

          duplicates=sorted({p for p in index_local if index_local.count(p)>1})

          css_import=re.compile(r'@import\s+(?:url\(\s*)?["\']([^"\']+)["\']\s*\)?',re.I)
          quoted_asset=re.compile(r'["\']((?:\./)?[A-Za-z0-9_./-]+\.(?:js|css)(?:\?[^"\']*)?)["\']',re.I)

          for css in root.rglob('*.css'):
              text=css.read_text(encoding='utf-8',errors='ignore')
              for raw in css_import.findall(text):
                  path=local_path(raw,css.parent)
                  if path is not None and not path.is_file():
                      missing.append(f'{css.relative_to(root)} -> {urlsplit(raw).path}')

          for js in root.rglob('*.js'):
              text=js.read_text(encoding='utf-8',errors='ignore')
              for raw in quoted_asset.findall(text):
                  path=local_path(raw,js.parent)
                  if path is not None and not path.is_file():
                      missing.append(f'{js.relative_to(root)} -> {urlsplit(raw).path}')

          if missing:
              raise SystemExit('Missing local assets:\n  '+'\n  '.join(sorted(set(missing))))
          if duplicates:
              raise SystemExit('Duplicate local index assets: '+', '.join(duplicates))
          print(f'Validated {len(index_local)} local index assets plus nested CSS/JS references.')
          PY
