name: Validate Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject private credentials in repository
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks|keystore)$|id_rsa($|\.)|secrets\.|credentials\.)' >/dev/null; then
            echo 'Tracked secret/environment file detected.'
            git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx|jks|keystore)$|id_rsa($|\.)|secrets\.|credentials\.)' || true
            exit 1
          fi
          if git grep -nIE '(service[_-]?role|sb_secret_[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9_-]{20,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|OPENAI_API_KEY[[:space:]]*=[[:space:]]*[^$<{[:space:]][^[:space:]]*)' -- ':!*.md' ':!*.yml' ':!*.yaml'; then
            echo 'Potential privileged credential detected in tracked source.'
            exit 1
          fi
          echo 'No obvious privileged credentials found.'
